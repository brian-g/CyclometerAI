name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: CyclometerTests
    # Pinned, not macos-latest: the app targets iOS 26.5, and macos-latest is still
    # macOS 15 / Xcode 16 with no iOS 26 SDK. macos-26 defaults to Xcode 26.5 and
    # ships an iOS 26.5 runtime with iPhone 17 Pro.
    runs-on: macos-26

    # The backstop for a genuinely hung test, and the right altitude for one.
    #
    # Per-test `.timeLimit` traits were tried twice (#97 on the BLE suites, before that
    # on PermissionsClientTests) and removed both times: a deadline inside the run is
    # subject to the same simulator contention it is meant to guard against, so it kills
    # tests that were merely delayed while a real hang on a healthy runner is obvious
    # anyway. A job timeout has no such coupling. Successful runs take 9–12 minutes.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # os_log writes .notice and above to the persisted store; .info and .debug live in a
      # memory ring buffer and are gone before anyone runs `log collect`. Ride 2026-09-06
      # collected 4,330 entries with not one speed, cadence or HR sample among them, because
      # all three logged at .info (#212). Nothing else in the repo can catch this: there is no
      # linter, and no test can observe an os.Logger.
      - name: BLE clients must not log at .info
        run: |
          if grep -rn 'logger\.info' Cyclometer/Cyclometer/Clients/BLE/; then
            echo "::error::.info never reaches the persisted log store — use .notice (assets/BLE.md §15)"
            exit 1
          fi

      - name: Show toolchain
        run: xcodebuild -version

      - name: Resolve SPM dependencies
        working-directory: Cyclometer
        run: xcodebuild -resolvePackageDependencies -project Cyclometer.xcodeproj -scheme Cyclometer

      # The destination used to be the literal name "iPhone 17 Pro", and twice that
      # device simply wasn't on the runner — 2026-08-30 and 2026-09-07 both died with
      # "Unable to find a device matching the provided destination specifier", the
      # second listing no concrete simulators at all. GitHub reimages macos-26 on its
      # own schedule and the preinstalled simulator set is not a contract. Resolve a
      # device (creating one if needed) instead of naming one.
      - name: Resolve a simulator
        run: .github/scripts/resolve-simulator.sh

      # -skipMacroValidation: Xcode won't expand SPM macros until they're explicitly
      # trusted, and that approval is a GUI prompt cached in local preferences — there
      # is no headless equivalent, so a fresh runner fails the build outright. The
      # macros here are the pointfreeco TCA stack, version-pinned in Package.resolved.
      #
      # -parallel-testing-enabled NO: xcodebuild otherwise clones the simulator to
      # split the suite across destinations, and that bought us two recurring problems
      # for no speedup. First, clone launch is itself flaky — the failures on
      # 2026-09-04 and 2026-09-07 both carry `FBSOpenApplicationServiceErrorDomain
      # Code=1 "Simulator device failed to launch com.xavier.cyclometer"`. Second, the
      # cloned-destination run switches xcodebuild to the terse legacy reporter, which
      # prints `Test case 'X' failed` and nothing else: the 2026-09-07 log contains
      # zero expectation text or line numbers for its three failures, so a failure
      # could not be told apart from an infra flake without this. Serial keeps the
      # Swift Testing reporter and its `recorded an issue at File.swift:LINE` output.
      #
      # The speedup was never real: the whole suite is ~8 seconds of execution
      # (715 tests, 69 suites). CI wall-clock is build and simulator boot, not tests.
      #
      # Snapshot suites are excluded deliberately, not by oversight. Their reference
      # images were recorded against a local simulator and SwiftUI pixel output
      # varies across runner images, so gating merges on them would be flaky from
      # day one. Running them in CI needs its own issue — record-on-CI or a
      # per-pixel tolerance. They all pass locally.
      - name: Run unit tests
        working-directory: Cyclometer
        run: |
          xcodebuild test \
            -project Cyclometer.xcodeproj \
            -scheme Cyclometer \
            -destination "id=$SIM_UDID" \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -only-testing:CyclometerTests \
            -skip-testing:CyclometerTests/HeroNumberSnapshotTests \
            -skip-testing:CyclometerTests/SpeedWidgetSnapshotTests \
            -skip-testing:CyclometerTests/CadenceWidgetSnapshotTests \
            -skip-testing:CyclometerTests/ActiveRideAccessorySnapshotTests \
            -skip-testing:CyclometerTests/DeviceManagementSnapshotTests \
            -skip-testing:CyclometerTests/StartSheetSnapshotTests \
            -skip-testing:CyclometerTests/SensorPairingSnapshotTests \
            -skip-testing:CyclometerTests/WelcomeSnapshotTests \
            -skip-testing:CyclometerTests/SettingsSnapshotTests \
            -skip-testing:CyclometerTests/RoutesSnapshotTests \
            -skip-testing:CyclometerTests/RouteDetailSnapshotTests

      # Every failure before this existed as three bare test names in 14k lines of
      # xcodebuild noise. The bundle carries the assertion text and source location;
      # the summary puts it on the job page so the common case needs no download.
      - name: Summarize test failures
        if: failure()
        run: |
          BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          if [ ! -d "$BUNDLE" ]; then
            echo "No result bundle — the run failed before tests started." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Test failures'
            echo '```'
            "$GITHUB_WORKSPACE/.github/scripts/summarize-xcresult.py" "$BUNDLE"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 14
